<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理総合 一問一答</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ocean:   #0b3d5e;
  --sea:     #1a6b8a;
  --teal:    #2a9d8f;
  --land:    #2d6a4f;
  --sand:    #e9c46a;
  --coral:   #e76f51;
  --cream:   #faf7f2;
  --parchment: #f0ebe0;
  --ink:     #1a1a2e;
  --muted:   #6b7c8d;
  --line:    rgba(42,157,143,0.18);
  --shadow:  0 4px 24px rgba(11,61,94,0.13);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--ocean);
  min-height: 100vh;
  color: var(--ink);
  position: relative;
  overflow-x: hidden;
}

/* Topographic background pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 38px,
      rgba(42,157,143,0.08) 38px,
      rgba(42,157,143,0.08) 39px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 38px,
      rgba(42,157,143,0.08) 38px,
      rgba(42,157,143,0.08) 39px
    );
  pointer-events: none;
  z-index: 0;
}

/* Topo curve overlays */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 15% 30%, rgba(42,157,143,0.12) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 85% 70%, rgba(26,107,138,0.14) 0%, transparent 60%),
    radial-gradient(ellipse 40% 35% at 50% 10%, rgba(11,61,94,0.3) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.app-wrapper {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─── HEADER ─── */
header {
  background: linear-gradient(135deg, rgba(11,61,94,0.95) 0%, rgba(26,107,138,0.9) 100%);
  border-bottom: 2px solid var(--teal);
  padding: 18px 24px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  overflow: hidden;
}

header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--teal), var(--sand), var(--teal), transparent);
}

.globe-icon {
  font-size: 34px;
  line-height: 1;
  filter: drop-shadow(0 2px 6px rgba(42,157,143,0.5));
}

.header-text { flex: 1; }

.header-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.06em;
  line-height: 1.2;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.header-sub {
  font-size: 10px;
  font-weight: 300;
  color: var(--teal);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-top: 3px;
}

.header-count {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  text-align: right;
  line-height: 1.5;
}
.header-count strong {
  display: block;
  font-size: 22px;
  font-weight: 700;
  color: var(--sand);
  line-height: 1;
}

/* ─── CONTROL PANEL ─── */
.control-panel {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(42,157,143,0.2);
  padding: 14px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Region toggles */
.region-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.region-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  white-space: nowrap;
  min-width: 46px;
}

.region-btn {
  flex: 1;
  padding: 10px 14px;
  border: 1.5px solid rgba(42,157,143,0.35);
  border-radius: 6px;
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.55);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  letter-spacing: 0.04em;
}
.region-btn .flag { font-size: 16px; }
.region-btn:hover {
  border-color: var(--teal);
  color: rgba(255,255,255,0.8);
}
.region-btn.active-ea {
  background: linear-gradient(135deg, rgba(45,106,79,0.6), rgba(42,157,143,0.4));
  border-color: var(--teal);
  color: #fff;
  box-shadow: 0 0 12px rgba(42,157,143,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}
.region-btn.active-se {
  background: linear-gradient(135deg, rgba(231,111,81,0.5), rgba(233,196,106,0.35));
  border-color: var(--coral);
  color: #fff;
  box-shadow: 0 0 12px rgba(231,111,81,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}

.region-count {
  font-size: 10px;
  opacity: 0.7;
  background: rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 1px 6px;
}

/* Filter row */
.filter-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(42,157,143,0.2);
  border-radius: 6px;
  padding: 6px 10px;
}

.filter-group label {
  font-size: 10px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
}

.filter-group input[type="number"] {
  width: 52px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(42,157,143,0.3);
  border-radius: 4px;
  color: #fff;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 12px;
  padding: 3px 6px;
  text-align: center;
}
.filter-group input[type="number"]::placeholder { color: rgba(255,255,255,0.25); }
.filter-group input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }

.sep { color: rgba(255,255,255,0.25); font-size: 12px; }

.start-btn {
  padding: 8px 18px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(135deg, var(--teal), var(--land));
  color: #fff;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.06em;
  white-space: nowrap;
  transition: all 0.2s;
  box-shadow: 0 2px 10px rgba(42,157,143,0.35);
}
.start-btn:hover {
  filter: brightness(1.12);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(42,157,143,0.45);
}

/* Mode row */
.mode-row {
  display: flex;
  gap: 8px;
}

.seg-ctrl {
  display: flex;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(42,157,143,0.2);
  border-radius: 6px;
  overflow: hidden;
  flex: 1;
}
.seg-btn {
  flex: 1;
  padding: 7px 8px;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.45);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.03em;
}
.seg-btn + .seg-btn { border-left: 1px solid rgba(42,157,143,0.2); }
.seg-btn.active {
  background: rgba(42,157,143,0.3);
  color: #fff;
}

/* ─── STATS BAR ─── */
.stats-bar {
  background: rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(42,157,143,0.15);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.stat-item {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  display: flex;
  align-items: center;
  gap: 5px;
}
.stat-item strong {
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  font-weight: 700;
}
.stat-divider { flex: 1; }
.progress-bar-wrap {
  flex: 1;
  max-width: 160px;
  height: 3px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal), var(--sand));
  border-radius: 2px;
  transition: width 0.3s;
}

/* ─── CARD AREA ─── */
.card-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  gap: 20px;
}

.page-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(42,157,143,0.25);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.12em;
}
.page-badge .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
.dot-ea { background: var(--teal); }
.dot-se { background: var(--coral); }

/* Card flip container */
.card-scene {
  width: 100%;
  max-width: 560px;
  height: 260px;
  perspective: 1200px;
}

.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}
.card.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Front: question */
.card-front {
  background: var(--cream);
  border: 1.5px solid rgba(42,157,143,0.2);
  box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.5) inset;
}

.card-front::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--face-accent, linear-gradient(90deg, var(--teal), var(--land)));
}

.card-region-tag {
  padding: 10px 16px 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.region-pill {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  padding: 2px 9px;
  border-radius: 10px;
  text-transform: uppercase;
}
.region-pill.ea {
  background: rgba(42,157,143,0.12);
  color: var(--land);
  border: 1px solid rgba(42,157,143,0.25);
}
.region-pill.se {
  background: rgba(231,111,81,0.1);
  color: #c0503a;
  border: 1px solid rgba(231,111,81,0.2);
}
.page-tag {
  font-size: 10px;
  color: var(--muted);
  margin-left: auto;
}
.card-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 24px 10px;
}
.card-q-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.card-text {
  font-family: 'Noto Serif JP', serif;
  font-size: clamp(15px, 3.5vw, 19px);
  font-weight: 400;
  color: var(--ink);
  line-height: 1.75;
  text-align: center;
}

.card-footer {
  padding: 8px 16px 12px;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

/* Back: answer */
.card-back {
  transform: rotateY(180deg);
  box-shadow: var(--shadow);
}
.card-back.ea-back {
  background: linear-gradient(155deg, #0f4a37 0%, #1a6b5a 50%, #2a9d8f 100%);
  border: 1.5px solid rgba(42,157,143,0.4);
}
.card-back.se-back {
  background: linear-gradient(155deg, #6b2a1a 0%, #a04030 50%, #e76f51 100%);
  border: 1.5px solid rgba(231,111,81,0.4);
}

.card-back::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(255,255,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 20% 80%, rgba(0,0,0,0.15) 0%, transparent 60%);
  border-radius: 14px;
}

.card-back .card-body {
  position: relative;
  z-index: 1;
  flex-direction: column;
  gap: 10px;
}
.card-back .card-text {
  color: #fff;
  font-size: clamp(20px, 5vw, 28px);
  font-weight: 700;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.card-back .card-q-label {
  color: rgba(255,255,255,0.5);
}
.card-back .card-footer {
  color: rgba(255,255,255,0.4);
  position: relative;
  z-index: 1;
}

/* ─── NAV BUTTONS ─── */
.nav-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 560px;
}

.nav-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 1.5px solid rgba(42,157,143,0.35);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.7);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.nav-btn:hover:not(:disabled) {
  background: rgba(42,157,143,0.25);
  border-color: var(--teal);
  color: #fff;
}
.nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

.flip-btn {
  flex: 1;
  height: 48px;
  border-radius: 24px;
  border: 1.5px solid rgba(42,157,143,0.4);
  background: rgba(42,157,143,0.15);
  color: rgba(255,255,255,0.85);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.flip-btn:hover {
  background: rgba(42,157,143,0.3);
  border-color: var(--teal);
  color: #fff;
}
.flip-btn span { font-size: 16px; }

/* ─── EMPTY STATE ─── */
.empty-state {
  text-align: center;
  color: rgba(255,255,255,0.4);
  padding: 48px 20px;
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* ─── SHUFFLE BTN ─── */
.action-row {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 560px;
}
.action-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid rgba(42,157,143,0.25);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.6);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.action-btn:hover {
  background: rgba(42,157,143,0.15);
  border-color: var(--teal);
  color: #fff;
}

@media (max-width: 480px) {
  .filter-row { flex-wrap: wrap; }
  .card-scene { height: 230px; }
  .card-text { font-size: 15px; }
}

/* ─── JUDGMENT BUTTONS ─── */
.judge-row {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 560px;
}
.judge-btn {
  flex: 1;
  height: 54px;
  border-radius: 12px;
  border: none;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: all 0.18s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.judge-wrong {
  background: rgba(231,111,81,0.18);
  border: 2px solid var(--coral);
  color: #ff9a85;
}
.judge-wrong:hover {
  background: rgba(231,111,81,0.38);
  color: #fff;
  transform: scale(1.02);
}
.judge-correct {
  background: rgba(42,157,143,0.18);
  border: 2px solid var(--teal);
  color: #6ddfd4;
}
.judge-correct:hover {
  background: rgba(42,157,143,0.38);
  color: #fff;
  transform: scale(1.02);
}

/* card back footer hint */
.hint-flip { color: rgba(255,255,255,0.35); font-size: 10px; }

/* ─── RESULTS SCREEN ─── */
.results-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: linear-gradient(160deg, #071e30 0%, #0b3d5e 40%, #0d3326 100%);
  overflow-y: auto;
  padding: 32px 20px 48px;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
.results-screen.show { display: flex; }

.results-header {
  text-align: center;
}
.results-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  letter-spacing: 0.22em;
  color: var(--teal);
  text-transform: uppercase;
  margin-bottom: 16px;
}
.results-rate {
  font-family: 'Noto Serif JP', serif;
  font-size: clamp(64px, 18vw, 100px);
  font-weight: 700;
  line-height: 1;
  background: linear-gradient(135deg, var(--teal), var(--sand));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.results-rate-label {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-top: 6px;
  letter-spacing: 0.1em;
}

.results-counts {
  display: flex;
  gap: 16px;
  width: 100%;
  max-width: 400px;
}
.results-count-box {
  flex: 1;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
}
.results-count-box.correct {
  background: rgba(42,157,143,0.12);
  border: 1.5px solid rgba(42,157,143,0.3);
}
.results-count-box.wrong {
  background: rgba(231,111,81,0.1);
  border: 1.5px solid rgba(231,111,81,0.25);
}
.rcb-num {
  font-family: 'Noto Serif JP', serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1;
}
.correct .rcb-num { color: var(--teal); }
.wrong .rcb-num { color: var(--coral); }
.rcb-label {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
  letter-spacing: 0.1em;
}

.results-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 400px;
}
.results-btn {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.results-btn.primary {
  background: linear-gradient(135deg, var(--coral), #c8503a);
  color: #fff;
  box-shadow: 0 4px 16px rgba(231,111,81,0.35);
}
.results-btn.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.results-btn.primary:disabled {
  opacity: 0.35; cursor: not-allowed; transform: none;
}
.results-btn.secondary {
  background: rgba(255,255,255,0.07);
  border: 1.5px solid rgba(42,157,143,0.3);
  color: rgba(255,255,255,0.75);
}
.results-btn.secondary:hover { background: rgba(42,157,143,0.2); color: #fff; }

.wrong-list-wrap {
  width: 100%;
  max-width: 400px;
}
.wrong-list-title {
  font-size: 11px;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.wrong-list-title::after {
  content: ''; flex: 1;
  height: 1px; background: rgba(255,255,255,0.1);
}
.wrong-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 280px;
  overflow-y: auto;
}
.wrong-item {
  background: rgba(231,111,81,0.08);
  border: 1px solid rgba(231,111,81,0.2);
  border-radius: 8px;
  padding: 10px 12px;
}
.wrong-item-q {
  font-size: 12px;
  color: rgba(255,255,255,0.65);
  line-height: 1.5;
  margin-bottom: 4px;
}
.wrong-item-a {
  font-size: 13px;
  font-weight: 700;

["G2",56,"マレーシアが1970年代にとった、マレー系住民の商工業進出を促す政策を何というか。","ブミプトラ政策",4],
["G2",56,"マレーシアが1981年に掲げた、日本や韓国の成功を見習って工業化を進める政策を何というか。","ルックイースト政策",4],
["G2",56,"国内生産によって外国製品の輸入を減らす工業化の方式を何というか。","輸入代替型工業",4],
["G2",56,"外資を導入し、輸出向け製品を生産するために設けられる特別地域を何というか。","輸出加工特区",4],
["G2",56,"輸出向け製品の生産を重視する工業化の方式を何というか。","輸出指向型工業",4],
["G2",56,"韓国・台湾・香港・シンガポールなどの新興工業経済地域を何というか。","アジアNIEs",4],
["G2",56,"ASEAN域内貿易の関税引き下げを目的に発足した自由貿易地域を何というか。","AFTA",4],
["G2",56,"AFTAの日本語名称を何というか。","ASEAN自由貿易地域",4],
["G2",57,"ASEANが2015年に発足させた、一つの経済圏をめざす組織を何というか。","AEC",4],
["G2",57,"AECの日本語名称を何というか。","ASEAN経済共同体",4],
["G2",57,"シンガポールの急速な経済発展を表す呼び名を何というか。","シンガポールの奇跡",4],
["G2",57,"複数の民族から構成される国家を何というか。","多民族国家",4],
["G2",57,"シンガポールに多い民族で、人口構成の大きな割合を占める民族系統を何というか。","中国系",4],
["G2",57,"タイの水産業などを支える、近隣国から移動してきた労働者を何というか。","移民労働者",4],
["G2",57,"タイ政府が2019年に批准した、漁業労働環境の改善に関わる国際機関の条約を何というか。","漁業労働条約",4],
["G2",57,"第二次世界大戦後も紛争が繰り返され、工業化が遅れたベトナム・ラオス・カンボジアをまとめて何というか。","インドシナ三国",4],

["G2",58,"自社ブランド商品の製造から販売までを行う製造小売業をアルファベット3文字で何というか。","SPA",4],
["G2",58,"複数国に活動拠点を置く企業を何というか。","多国籍企業",4],
["G2",58,"複数国の間で、工程や役割を分担して生産・流通を行う仕組みを何というか。","国際分業",4],
["G2",58,"農産物や工業製品の貿易自由化、途上国問題、紛争処理などを扱う国際機関を何というか。","世界貿易機関",4],
["G2",58,"世界貿易機関をアルファベット3文字で何というか。","WTO",4],
["G2",58,"WTOが取り組む、通商交渉全般に関わる交渉を何というか。","新多角的貿易交渉",4]

// ─── STATE ──────────────────────────────────────────────────────────────
let selectedRegions = new Set(['G1','G2']);
let mode = 'seq';   // 'seq' | 'rnd'
let dir  = 'qa';    // 'qa'  | 'aq'
let deck = [];
let currentIdx = 0;
let isFlipped = false;
let results = [];   // true=正解, false=不正解, per deck index

// ─── FILTER ─────────────────────────────────────────────────────────────
function getFiltered() {
  const pMin = parseInt(document.getElementById('pageMin').value) || 0;
  const pMax = parseInt(document.getElementById('pageMax').value) || 9999;
  return RAW.filter(q =>
    selectedRegions.has(q[0]) &&
    q[1] >= pMin && q[1] <= pMax
  );
}

function buildDeck(customDeck) {
  const filtered = customDeck || getFiltered();
  deck = mode === 'rnd' && !customDeck
    ? [...filtered].sort(() => Math.random() - 0.5)
    : [...filtered];
  results = new Array(deck.length).fill(null);
  currentIdx = 0;
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('resultsScreen').classList.remove('show');
  setJudgeMode(false);
  renderCard();
  updateStats();
}

// ─── RENDER ─────────────────────────────────────────────────────────────
function renderCard() {
  const isEmpty = deck.length === 0;
  document.getElementById('emptyState').style.display = isEmpty ? 'block' : 'none';
  document.getElementById('badgeWrap').style.display = isEmpty ? 'none' : '';
  document.querySelector('.card-scene').style.display = isEmpty ? 'none' : '';
  document.getElementById('flipRow').style.display = isEmpty ? 'none' : '';
  document.getElementById('judgeRow').style.display = 'none';
  document.querySelector('.action-row').style.display = isEmpty ? 'none' : '';
  if (isEmpty) return;

  const q = deck[currentIdx];
  const isEA = q[0] === 'G1';

  // Badge
  document.getElementById('badgeDot').className = 'dot ' + (isEA ? 'dot-ea' : 'dot-se');
  document.getElementById('badgeText').textContent =
    (isEA ? '東アジア' : '東南アジア') + '  P.' + q[1];

  // Region pill
  const pill = document.getElementById('regionPill');
  pill.textContent = isEA ? '東アジア' : '東南アジア';
  pill.className = 'region-pill ' + (isEA ? 'ea' : 'se');

  // Front accent color
  document.getElementById('cardFront').style.setProperty(
    '--face-accent',
    isEA
      ? 'linear-gradient(90deg, #2a9d8f, #2d6a4f)'
      : 'linear-gradient(90deg, #e76f51, #e9c46a)'
  );

  // Page
  document.getElementById('pageTag').textContent = 'P.' + q[1];

  // Card back class
  document.getElementById('cardBack').className =
    'card-face card-back ' + (isEA ? 'ea-back' : 'se-back');

  // Text
  const question = q[2], answer = q[3];
  if (dir === 'qa') {
    document.getElementById('frontLabel').textContent = '問 題';
    document.getElementById('frontText').textContent  = question;
    document.getElementById('backLabel').textContent  = '解 答';
    document.getElementById('backText').textContent   = answer;
  } else {
    document.getElementById('frontLabel').textContent = '解 答';
    document.getElementById('frontText').textContent  = answer;
    document.getElementById('backLabel').textContent  = '問 題';
    document.getElementById('backText').textContent   = question;
  }
}

function updateStats() {
  const total = deck.length;
  document.getElementById('filtTotal').textContent = total;
  document.getElementById('currNum').textContent = total > 0 ? currentIdx + 1 : 0;
  const answered = results.filter(r => r !== null).length;
  const pct = total > 0 ? (answered / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('pageInfo').textContent =
    deck.length > 0 ? 'P.' + deck[currentIdx][1] : '';
}

// ─── FLIP & JUDGE ────────────────────────────────────────────────────────
function setJudgeMode(on) {
  document.getElementById('flipRow').style.display = on ? 'none' : '';
  document.getElementById('judgeRow').style.display = on ? '' : 'none';
}

function flipCard() {
  if (results[currentIdx] !== null) return; // already judged
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
  if (isFlipped) setJudgeMode(true);
  else setJudgeMode(false);
}

function judge(correct) {
  results[currentIdx] = correct;

  // ① まず表に戻すアニメーションを開始
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  setJudgeMode(false);

  // ② アニメーション完了後（550ms）に中身を差し替え
  setTimeout(() => {
    updateStats();

    if (results.every(r => r !== null)) {
      showResults();
      return;
    }

    let next = currentIdx + 1;
    while (next < deck.length && results[next] !== null) next++;
    if (next < deck.length) currentIdx = next;

    renderCard();
    updateStats();
  }, 560);
}

// ─── RESULTS ─────────────────────────────────────────────────────────────
function showResults() {
  const total   = deck.length;
  const correct = results.filter(r => r === true).length;
  const wrong   = results.filter(r => r === false).length;
  const rate    = Math.round(correct / total * 100);

  document.getElementById('resultsRate').textContent = rate + '%';
  document.getElementById('resultsRateLabel').textContent =
    `${correct} 問正解 / 全 ${total} 問`;
  document.getElementById('correctNum').textContent = correct;
  document.getElementById('wrongNum').textContent = wrong;

  // Retry button
  const retryBtn = document.getElementById('retryBtn');
  retryBtn.disabled = wrong === 0;
  retryBtn.textContent = wrong > 0 ? `↩ 不正解 ${wrong} 問を再挑戦` : '✓ 全問正解！';

  // Wrong list
  const wrongItems = deck.filter((_, i) => results[i] === false);
  const wrap = document.getElementById('wrongListWrap');
  const list = document.getElementById('wrongList');
  if (wrongItems.length > 0) {
    list.innerHTML = wrongItems.map(q => {
      const isEA = q[0] === 'G1';
      const qText = dir === 'qa' ? q[2] : q[3];
      const aText = dir === 'qa' ? q[3] : q[2];
      return `
        <div class="wrong-item">
          <div class="wrong-item-region">${isEA ? '🏯 東アジア' : '🌴 東南アジア'} P.${q[1]}</div>
          <div class="wrong-item-q">${qText}</div>
          <div class="wrong-item-a">→ ${aText}</div>
        </div>`;
    }).join('');
    wrap.style.display = '';
  } else {
    wrap.style.display = 'none';
  }

  document.getElementById('resultsScreen').classList.add('show');
}

function retryWrong() {
  const wrongItems = deck.filter((_, i) => results[i] === false);
  if (wrongItems.length === 0) return;
  document.getElementById('resultsScreen').classList.remove('show');
  buildDeck(wrongItems);
}

function restartSession() {
  document.getElementById('resultsScreen').classList.remove('show');
  buildDeck();
}

function shuffleDeck() {
  deck = [...deck].sort(() => Math.random() - 0.5);
  results = new Array(deck.length).fill(null);
  currentIdx = 0;
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('resultsScreen').classList.remove('show');
  setJudgeMode(false);
  renderCard();
  updateStats();
}

// ─── CONTROLS ─────────────────────────────────────────────────────────────
function toggleRegion(r) {
  if (selectedRegions.has(r)) {
    if (selectedRegions.size === 1) return;
    selectedRegions.delete(r);
  } else {
    selectedRegions.add(r);
  }
  const btn = document.getElementById('btn-' + r);
  btn.className = 'region-btn' + (selectedRegions.has(r)
    ? (r === 'G1' ? ' active-ea' : ' active-se') : '');
  buildDeck();
}

function setMode(m) {
  mode = m;
  document.getElementById('mode-seq').classList.toggle('active', m === 'seq');
  document.getElementById('mode-rnd').classList.toggle('active', m === 'rnd');
  buildDeck();
}

function setDir(d) {
  dir = d;
  document.getElementById('dir-qa').classList.toggle('active', d === 'qa');
  document.getElementById('dir-aq').classList.toggle('active', d === 'aq');
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  setJudgeMode(false);
  renderCard();
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (document.getElementById('resultsScreen').classList.contains('show')) return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!isFlipped) flipCard();
  }
  if (e.key === 'ArrowRight' && isFlipped) judge(true);
  if (e.key === 'ArrowLeft'  && isFlipped) judge(false);
});

// ─── INIT ──────────────────────────────────────────────────────────────
buildDeck();
</script>
